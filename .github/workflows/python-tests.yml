name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile run_workflow.py

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: CLI help
        run: python run_workflow.py --help